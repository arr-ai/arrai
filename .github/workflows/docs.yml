name: Docs

on: [pull_request]

env:
  NPM_CONFIG_REGISTRY: ${{ vars.NPM_CONFIG_REGISTRY }}

jobs:
  build:
    name: Build Docusaurus site
    runs-on: ${{ vars.RUNNER_UBUNTU && fromJSON(vars.RUNNER_UBUNTU) || 'ubuntu-latest' }}
    steps:
      - name: Check out code into the Go module directory
        uses: actions/checkout@v4

      - name: Uses Node.js 18.x
        uses: actions/setup-node@v4
        with:
          node-version: 20.x

      - name: npm build docs
        working-directory: docs
        run: |
          # Switch registry in package-lock.json if override provided
          if [ -n "${{ env.NPM_CONFIG_REGISTRY }}" ]; then
            sed -i'.bak' 's#https://registry.npmjs.org#${{ env.NPM_CONFIG_REGISTRY }}#' package-lock.json
            rm package-lock.json.bak
          fi

          npm ci && npm run build
