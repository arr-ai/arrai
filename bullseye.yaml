  T10:
    name: Accumulator folds build through a mutable builder instead of copying a persistent collection per step
    status: achieved
    value: 0.0
    cost: 0.0
    attestation: 'Achieved by ownership frontiers rather than the last-use analysis originally imagined - no compiler analysis needed. Fold-stress benchmarks (syntax/expr_fold_bench_test.go, 3000 steps) as the oracle: relations were linear since the arena (colStore frontier), strings since appendBuf; this commit (8768213) fixed the two stragglers - generic sets 878ms/691MB -> 4.9ms/5.1MB (canonical flag skips per-step CanonicalSet rebuild) and arrays 11.4ms/80MB -> 2.0ms/2.2MB (appendBuf generalised). Dicts ride frozen''s structural sharing. All oracles green: slowpath, race, corpus 108/108, lint, reconstruct byte-identical. The Perceus/last-use research remains relevant only for in-place mutation of frozen trees, which no measured workload needs.'
    acceptance:
    - The compiler identifies bindings whose value is dead after a use and captured by no escaping closure, and marks the consuming operation as permitted to reuse its argument
    - 'A fold whose accumulator is threaded and never aliased (reduce-shaped, and the `acc | {x}` / `acc +> {k: v}` idioms) runs on a frozen builder for the whole fold, persisting once'
    - 'Semantics are unchanged: a test asserts that retaining the pre-fold accumulator still observes the original value'
    - groupByKey-style folds in the sysl workload no longer show large-receiver Union/With calls when re-instrumented; wall time recorded
    - go test ./... (incl. -race), ./arrai test and lint pass; repro output byte-identical
    context: |-
      Measured 30 Aug 2026. Instrumenting receiver sizes shows ordinary arr.ai code never extends large collections incrementally (test corpus: Tuple.With 6216, all <=4 attrs; Dict.With 5; Union 25), but the sysl workload does it 12,000+ times on receivers over 256 elements — not via `with` but via union-with-a-singleton inside reduce folds (groupByKey: `dict +> {key: (dict(key)?:{}) | {row}}`). Persistence is what keeps that from being O(n^2) copying, so the win is to detect that the accumulator is unshared and use a builder. Research: Lean 4 'Counting Immutable Beans' (IFL 2019) and Koka 'Perceus' (PLDI 2021) do this with reference counts plus reuse analysis; Clojure transients do it with explicit ownership transfer; Clean/Linear Haskell do it in the type system. arr.ai is a pure interpreter that owns every reference, so a conservative last-use analysis over the Expr tree should suffice without runtime refcounts.

      Achieved 2026-08-31: Achieved by ownership frontiers rather than the last-use analysis originally imagined - no compiler analysis needed. Fold-stress benchmarks (syntax/expr_fold_bench_test.go, 3000 steps) as the oracle: relations were linear since the arena (colStore frontier), strings since appendBuf; this commit (8768213) fixed the two stragglers - generic sets 878ms/691MB -> 4.9ms/5.1MB (canonical flag skips per-step CanonicalSet rebuild) and arrays 11.4ms/80MB -> 2.0ms/2.2MB (appendBuf generalised). Dicts ride frozen's structural sharing. All oracles green: slowpath, race, corpus 108/108, lint, reconstruct byte-identical. The Perceus/last-use research remains relevant only for in-place mutation of frozen trees, which no measured workload needs.
    tags:
    - performance
    - evaluator
    - research
    origin: manual
    discovered: 2026-08-30
    achieved: 2026-08-31
  T11:
    name: Relations are stored columnar with lazy indexing
    status: achieved
    value: 0.0
    cost: 0.0
    attestation: 'positionalRelation rewritten as flat-arena colStore + selection-vector views + lazy 128-bit hash index. Oracles: go test ./... green; -tags slowpath green; -race -tags timingsensitive ./... green; golangci-lint 0 issues; arrai test 108/108; perf/reconstruct byte-identical to v0.321.0, ratchet lowered 44.0->43.0 (measured 42.16M). Benchmarks at 12k rows: Build 3.18ms/44,163 allocs -> 1.55ms/139 allocs; Join 7.24ms/115k -> 2.4ms/173; GroupByCold 6.56ms -> 0.57ms; Has 84us/500 -> 44us/0; Enumerate 622us -> 258us; Where time ~flat (tuple-inflation-bound) but -42% allocs, -35% bytes.'
    acceptance:
    - positionalRelation stores rows in flat column vectors with a lazy row index built only when Has/With/Without/dedupe demands it
    - BenchmarkRelationBuild and BenchmarkRelationWhere improve materially vs the HAMT baseline (3.18ms/44k allocs and 333µs/20.7k allocs at 12k rows)
    - go test ./... passes with and without -tags slowpath
    - perf/reconstruct output remains byte-identical and its allocation ratchet is lowered if earned
    context: |-
      Measured ceiling from the 2026-08 evaluator work: building 1000 rows costs 1,946 allocations as a HAMT vs 1 as a flat column; a where that shares columns and returns a row-index vector is 9x cheaper than rebuilding the tree. Most relational operations preserve distinctness and never need the index.

      Achieved 2026-08-31: positionalRelation rewritten as flat-arena colStore + selection-vector views + lazy 128-bit hash index. Oracles: go test ./... green; -tags slowpath green; -race -tags timingsensitive ./... green; golangci-lint 0 issues; arrai test 108/108; perf/reconstruct byte-identical to v0.321.0, ratchet lowered 44.0->43.0 (measured 42.16M). Benchmarks at 12k rows: Build 3.18ms/44,163 allocs -> 1.55ms/139 allocs; Join 7.24ms/115k -> 2.4ms/173; GroupByCold 6.56ms -> 0.57ms; Has 84us/500 -> 44us/0; Enumerate 622us -> 258us; Where time ~flat (tuple-inflation-bound) but -42% allocs, -35% bytes.
