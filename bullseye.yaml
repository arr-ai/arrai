  T9:
    name: 'Tuples are shape-backed structs: interned Shape + values slice, with zero-copy relation rows'
    status: achieved
    value: 0.0
    cost: 0.0
    attestation: 'rel/shape.go (interned Shape with name hashes, Names set, bucket key, memoised With/Without transitions), GenericTuple = {shape, vals} in rel/value_tuple.go; Relation precomputes shape/layout and inflates rows zero-copy when in shape order (relationBuilder adds shaped tuples zero-copy too); DotExpr caches (shape,index); TupleExpr with static names allocates directly into its shape. Tuple interface unchanged. Oracles: go clean -testcache && go test ./... exit 0; -race -tags timingsensitive rel/syntax ok; ./arrai test 108/108; golangci-lint 0 issues; differential run of 24 repo .arrai files identical to v0.339.0 binary; reconstruct output byte-identical to v0.321.0. Profile of the repro: no GenericTuple.Enumerator/With/Equal, TupleBuilder.Finish or valuesToTuple in the top cumulative nodes (TupleExpr.Eval 3.7% is the literal evaluation); allocation 2.85GB -> 1.88GB; wall 2.98s -> 2.13s.'
    acceptance:
    - GenericTuple is {shape *Shape; vals []Value}; shapes are interned per distinct sorted name set, cache name hashes, the Names set, the relation bucket key, and With/Without transitions
    - Relation rows in shape order inflate to tuples without copying or hashing; other layouts copy once without hashing
    - DotExpr caches (shape, index); tuple literals without wildcards or view attrs allocate one values slice into a precomputed shape
    - Tuple interface unchanged; go test ./... (incl. -race -tags timingsensitive), ./arrai test, lint pass; reconstruct repro output byte-identical to v0.321.0; differential run of all repo .arrai files identical
    - 'Profile of the repro recorded: GenericTuple.Enumerator/With/Equal, TupleBuilder.Finish and valuesToTuple no longer in the top 30 cumulative nodes; wall time recorded in the commit message'
    context: |-
      After frames (🎯T7) and hash128, tuple construction/enumeration/equality/inflation is ~25% of the repro's CPU and the largest allocator (frozen map iterators). Tuples are struct-shaped and the same attribute sets recur; a hidden-class (shape) representation makes Get/With/Equal/Hash positional and lets relation rows be the tuple's values directly.

      Achieved 2026-08-29: rel/shape.go (interned Shape with name hashes, Names set, bucket key, memoised With/Without transitions), GenericTuple = {shape, vals} in rel/value_tuple.go; Relation precomputes shape/layout and inflates rows zero-copy when in shape order (relationBuilder adds shaped tuples zero-copy too); DotExpr caches (shape,index); TupleExpr with static names allocates directly into its shape. Tuple interface unchanged. Oracles: go clean -testcache && go test ./... exit 0; -race -tags timingsensitive rel/syntax ok; ./arrai test 108/108; golangci-lint 0 issues; differential run of 24 repo .arrai files identical to v0.339.0 binary; reconstruct output byte-identical to v0.321.0. Profile of the repro: no GenericTuple.Enumerator/With/Equal, TupleBuilder.Finish or valuesToTuple in the top cumulative nodes (TupleExpr.Eval 3.7% is the literal evaluation); allocation 2.85GB -> 1.88GB; wall 2.98s -> 2.13s.
    tags:
    - performance
    - evaluator
    origin: manual
    discovered: 2026-08-29
    achieved: 2026-08-29
