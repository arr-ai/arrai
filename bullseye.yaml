    attestation: 'rel/parallel.go fan-out reusing frozen''s knob (MinParallelChunk/DisableParallel); positionalRelation.Where parallel with ascending-sel concat; DArrowExpr.evalParallel on the IdentPattern path. Deterministic first-element error verified 20x under load (TestWhereParallelFirstError) and at syntax level ("input 2" from 5000 elements). Oracles: go test ./... green; -tags slowpath green; -race -tags timingsensitive ./... green; lint 0 issues; arrai test 108/108; reconstruct byte-identical at 1.87s (was 2.08s). Benchmarks, 50k elements: where 29.1ms->13.4ms (2.2x), => 58.9ms->21.4ms (2.7x).'
    acceptance:
    - positionalRelation.Where and DArrowExpr fan closure evaluation out across goroutines above frozen.MinParallelChunk, governed by the same knob as frozen's internal parallelism
    - 'Errors are deterministic: the first failing element in enumeration order, sequential and parallel alike'
    - go test ./... passes with and without -tags slowpath and under -race -tags timingsensitive
