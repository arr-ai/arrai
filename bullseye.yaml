  T5:
    name: docs/ npm audit is clean
    status: achieved
    value: 3.0
    cost: 3.0
    acceptance:
    - '`cd docs && npm audit` reports 0 vulnerabilities'
    - '`cd docs && npm run build` succeeds with no new errors'
    - No runtime regressions in the built docs site
    context: |-
      Achieved 2026-07-15. Surgical npm `overrides` in docs/package.json pin vulnerable
      transitive leaves (serialize-javascript, picomatch, brace-expansion, path-to-regexp,
      webpack-dev-server, ws, shell-quote, js-yaml@3.15, etc.) without advancing webpack
      past webpackbar compatibility. `npm audit` → 0; `npm run build` succeeds.
    tags:
    - security
    - docs
    - dependencies
    origin: Surfaced 2026-04-11 while fixing lodash CVE GHSA-r5fr-rjxr-66jc (commit 0b34341). `npm audit` flagged 22 remaining advisories; triage showed they're all stale transitive pins, not genuinely unfixable.
    discovered: 2026-04-11
    achieved: 2026-07-15
  T6:
    name: Netlify docs deploy preview builds cleanly
    status: achieved
    value: 2.0
    cost: 2.0
    acceptance:
    - Netlify deploy preview succeeds on docs PRs (deploy/netlify, Header rules, Pages changed, Redirect rules all pass)
    - No manual dashboard config drift — build config lives in repo (netlify.toml or equivalent)
    context: |-
      Achieved 2026-07-15. Added root netlify.toml with base=docs, command=`npm ci && npm run build`,
      publish=build so Netlify uses the committed package-lock.json and npm overrides instead of
      yarn (which ignored overrides and broke webpackbar).
    tags:
    - docs
    - ci
    - netlify
    origin: Surfaced 2026-04-11 while releasing v0.336.0 via /release. GitHub Actions docs workflow was broken identically and got fixed; Netlify pipeline is separate and still broken.
    discovered: 2026-04-11
    achieved: 2026-07-15
