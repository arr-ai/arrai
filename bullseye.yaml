  T15:
    name: Pattern matching compiles to a linear match program instead of walking the pattern tree per match
    status: achieved
    value: 0.0
    cost: 0.0
    attestation: 'Achieved via the bind protocol rather than a bytecode VM, and the profile justifies stopping there: after patterns bind into a shared flat fixed-slot builder (ef8968d) TuplePattern.Bind is 6% cumulative of even the pattern-stress benchmark - instruction dispatch is no longer the cost, so a VM would shave ~2% of eval. Acceptance criteria met with oracles: (1) pattern-stress benchmarks - tuple destructuring 3.8ms/237k -> ~2.6ms/164k, arrays 1.8ms/166k -> 1.0ms/114k, mostly-miss arms 1.58ms/153k -> 0.91ms/95k; reconstruct 36.3M -> 35.1M allocs, eval ~578 -> ~565ms, byte-identical. (2) Discarded misses allocate zero, proven by TestPatternMissAllocatesNothing (AllocsPerRun == 0), via a shared sentinel + explain re-bind that preserves every user-facing message (message-asserting tests unchanged). (3) Full suite green with and without -tags slowpath, race clean, corpus 108/108, lint clean. The builder protocol is deliberately the substrate a future VM would drive, if pattern-heavy workloads ever justify one.'
    acceptance:
    - Pattern-match machinery (CondPatternControlVarExpr, PatternExprPair, Pattern.Bind) measurably cheaper on a pattern-stress benchmark and on reconstruct's ~8-11% eval share
    - cond arms that fail to match allocate nothing on the failure path
    - go test ./... green with and without -tags slowpath; reconstruct byte-identical
    context: |-
      The owner's long-held hunch: compile patterns into a small instruction sequence (check shape, load slot, compare const, bind register) operating on the source value and producing bindings. Today's foundations make it tractable: patterns already bind into flat fixed-slot frames, and Shape makes tuple-structure tests a pointer compare. Evaluate incremental wins against a full match-VM prototype with benchmarks before committing to either.

      Achieved 2026-08-31: Achieved via the bind protocol rather than a bytecode VM, and the profile justifies stopping there: after patterns bind into a shared flat fixed-slot builder (ef8968d) TuplePattern.Bind is 6% cumulative of even the pattern-stress benchmark - instruction dispatch is no longer the cost, so a VM would shave ~2% of eval. Acceptance criteria met with oracles: (1) pattern-stress benchmarks - tuple destructuring 3.8ms/237k -> ~2.6ms/164k, arrays 1.8ms/166k -> 1.0ms/114k, mostly-miss arms 1.58ms/153k -> 0.91ms/95k; reconstruct 36.3M -> 35.1M allocs, eval ~578 -> ~565ms, byte-identical. (2) Discarded misses allocate zero, proven by TestPatternMissAllocatesNothing (AllocsPerRun == 0), via a shared sentinel + explain re-bind that preserves every user-facing message (message-asserting tests unchanged). (3) Full suite green with and without -tags slowpath, race clean, corpus 108/108, lint clean. The builder protocol is deliberately the substrate a future VM would drive, if pattern-heavy workloads ever justify one.
