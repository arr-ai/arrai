      Achieved 2026-08-31: rel/parallel.go fan-out reusing frozen's knob (MinParallelChunk/DisableParallel); positionalRelation.Where parallel with ascending-sel concat; DArrowExpr.evalParallel on the IdentPattern path. Deterministic first-element error verified 20x under load (TestWhereParallelFirstError) and at syntax level ("input 2" from 5000 elements). Oracles: go test ./... green; -tags slowpath green; -race -tags timingsensitive ./... green; lint 0 issues; arrai test 108/108; reconstruct byte-identical at 1.87s (was 2.08s). Benchmarks, 50k elements: where 29.1ms->13.4ms (2.2x), => 58.9ms->21.4ms (2.7x).
