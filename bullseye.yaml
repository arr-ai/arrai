  T7:
    name: 'Variable lookup never hashes: scopes are lexical frames and identifier reads resolve to a frame slot'
    status: achieved
    value: 0.0
    cost: 0.0
    attestation: 'c722ec4 + follow-up: Scope is chained frames (rel/scope.go); IdentExpr caches (hops, slot) with verification (rel/expr_ident.go); rel/scope_test.go covers shadowing, update order, Without, MatchedUpdate conflicts and cache invalidation under shape changes. go test ./..., -race -tags timingsensitive rel/syntax, ./arrai test 108/108, lint 0 issues. Repro 4.4-5.1s -> 3.6-4.3s, output byte-identical to v0.321.0. Profile of the new build shows no Scope.Update, Map.Combine or name hashing in the top 400 nodes.'
    acceptance:
    - rel.Scope is backed by chained frames (parent pointer + small name/value slices), not a frozen.Map; With/Update allocate one frame, no hashing
    - IdentExpr reads resolve to (depth, slot) after first evaluation and verify the slot on hit, falling back to a name walk; correctness never depends on the cached address
    - go test ./... (incl. -race -tags timingsensitive) and ./arrai test pass; reconstruct repro output byte-identical to v0.321.0
    - Scope.Update, frozen Map.Combine and hash.String on identifier names no longer appear in the repro's top-100 CPU nodes
    - Repro wall time improves measurably over v0.339.0 (4.4–5.1s) and the number is recorded in the commit message
    context: |-
      After v0.339.0, scope merges (Scope.Update → HAMT Combine, per-op EqArgs/CombineArgs, branch/leaf copies) are ~6.5% CPU and ~30% of remaining allocation, and every identifier read hashes its name. Scoping is lexical, so frames have static shape and reads can be addressed by slot. Full closure conversion (compile-time-only resolution, flat upvalue arrays) is the follow-on if the frame walk for module-level names still shows in profiles.

      Achieved 2026-08-29: c722ec4 + follow-up: Scope is chained frames (rel/scope.go); IdentExpr caches (hops, slot) with verification (rel/expr_ident.go); rel/scope_test.go covers shadowing, update order, Without, MatchedUpdate conflicts and cache invalidation under shape changes. go test ./..., -race -tags timingsensitive rel/syntax, ./arrai test 108/108, lint 0 issues. Repro 4.4-5.1s -> 3.6-4.3s, output byte-identical to v0.321.0. Profile of the new build shows no Scope.Update, Map.Combine or name hashing in the top 400 nodes.
    tags:
    - performance
    - evaluator
    origin: manual
    discovered: 2026-08-29
    achieved: 2026-08-29
